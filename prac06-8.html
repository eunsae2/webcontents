<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>eval()로 수식 계산</title>
</head>

<body>
    <h3>eval()로 수식 계산</h3>
    <hr>
    <script>
        su = prompt("수식 입력");
        result = eval(su);
        document.write(su + " = " + result);
    </script>
</body>

</html>
