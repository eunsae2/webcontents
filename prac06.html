<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            img {
                animation-name: spin;
                animation-duration: 1s;
                animation-iteration-count: infinite;
            }
            @keyframes spin {
                from {transform: rotate(0deg);}
                to {transform: rotate(360deg);}
            }
        </style>
    </head>
    <body>
        <img src="media/spongebob.png">
    </body>
</html>
