<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>설문지</title>
        <style>
        body {
            background-color: aliceblue;
            margin: 20px;
            font-family: "휴먼편지체";
        }
        h1 {
            color: brown;
            text-align: center;
            font-family: sans-serif;
        }
        .survey-box {
            background-color: #ffb6c1;
            padding: 20px;
            margin-bottom: 20px;
        }
        footer {
            background-color: orange;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
    </head>
    <body>
        <header>
            <h1>설문지</h1>
            <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        </header>

        <hr>
        <form>
            <div class="survey-box">
                <label>학년 </label>
                <label><input type="radio" name="grade" value="1" checked>1학년</label>
                <label><input type="radio" name="grade" value="2">2학년</label>
                <label><input type="radio" name="grade" value="3">3학년</label>
                <br><br>
                
                <label>성별 </label>
                <label><input type="radio" name="gender" value="1">남</label>
                <label><input type="radio" name="gender" value="2">여</label>
                <br><br>
                
                <label for="interesting">관심 분야 </label>
                <select name="interesting" id="interesting">
                    <option value="1">모바일 소프트웨어</option>
                    <option value="2">웹 소프트웨어</option>
                    <option value="3">AI 소프트웨어</option>
                </select>
                <br><br>
                
                <label>진로 </label>
                <label><input type="checkbox" value="1" checked>개발</label>
                <label><input type="checkbox" value="2">기획</label>
                <label><input type="checkbox" value="3">영업</label>
                <label><input type="checkbox" value="4">창업</label>
                <br><br>
                
                남기고 싶은 말 <textarea cols="50" rows="7">글을 남겨주세요</textarea>
            </div>

            <footer>
                <p>Copyright 2026 by MYONGJI COLLEGE</p>
            </footer>
        </form>
    </body>
</html>
