<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>암호를 입력하라</title>
</head>

<body>
    <h3>암호를 입력하라!</h3>
    <hr>
    <script>
        while (true) {
            pw = prompt("암호를 대라");

            if (pw == "you") {
                break;
            }
        }
        document.write("통과!");
    </script>
</body>

</html>
