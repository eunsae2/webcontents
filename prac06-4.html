<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>월화수목금토일</title>
</head>

<body>
    <h3>월화수목금토일</h3>
    <hr>
    <script>
        let day = "월";
        let s = prompt("월화수목금토일 중에서 입력하세요");
        switch (s) {
            case "월":
            case "화":
            case "수":
            case "목":
            case "금": document.write("출근");
                break;
            case "토":
            case "일": document.write("휴일");
                break;
        }
    </script>
</body>
